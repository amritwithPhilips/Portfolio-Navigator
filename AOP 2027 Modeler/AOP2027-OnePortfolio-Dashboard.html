<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AOP 2027 | Philips IT One Portfolio Dashboard</title>
<style>
@font-face{font-family:'Neue Frutiger World';src:local('Neue Frutiger World'),local('Frutiger');font-weight:400}
:root{
  --blue:#0B5ED7;--dk:#00126E;--lt:#BDF0FF;--bg:#FAFBFC;--card:#FFFFFF;
  --border:#D5DAE0;--mist:#E8EDF2;--text:#1A1F2B;--text2:#4A5568;--text3:#8895A7;
  --prot:#008800;--protbg:#ADFFB5;--disc:#FCA708;--discbg:#FCFCC2;--weak:#D43F44;--weakbg:#FFDEDB;
  --stage1:#00126E;--stage2:#0B5ED7;--stage3:#008BA3;--stage4:#226EB0;--stage5:#70ADE0;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:13px/1.5 'Neue Frutiger World','Frutiger',Calibri,'Segoe UI',Arial,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:1px solid var(--border);border-radius:4px;background:white;padding:7px 12px;color:var(--dk)}
button:hover{border-color:var(--blue)}
button.primary{background:var(--blue);border-color:var(--blue);color:white}
button.dark{background:var(--dk);color:white;border-color:var(--dk)}
input[type=number],input[type=text],select{border:1px solid var(--border);border-radius:4px;padding:5px 7px;background:white;color:var(--text)}
input[type=range]{accent-color:var(--blue);width:100%;height:18px}
h1,h2,h3,p{margin-top:0}
h2{font-size:17px;color:var(--dk);margin-bottom:10px}
h3{font-size:14px;color:var(--dk);margin-bottom:8px}
p{margin-bottom:9px}
a{color:var(--blue)}

/* Header */
.hdr{background:var(--blue);padding:12px 24px;display:flex;align-items:center;gap:16px;color:#fff;flex-wrap:wrap}
.hdr h1{font-size:17px;font-weight:300;margin:0;white-space:nowrap}
.hdr .tag{font-size:10px;border:1px solid rgba(255,255,255,.4);border-radius:3px;padding:2px 6px;margin-left:4px}
.hdr .subtitle{font-size:11px;opacity:.75;margin-left:auto}

/* Workflow bar */
.workflow{background:var(--dk);display:flex;padding:0;margin:0;list-style:none}
.workflow li{flex:1;text-align:center;padding:8px 4px;font-size:11px;color:rgba(255,255,255,.6);cursor:pointer;border-bottom:3px solid transparent;transition:all .15s;position:relative}
.workflow li:hover{color:rgba(255,255,255,.9)}
.workflow li.active{color:#fff;border-bottom-color:var(--lt);background:rgba(255,255,255,.08)}
.workflow li .step-num{display:inline-block;width:18px;height:18px;line-height:18px;border-radius:50%;background:rgba(255,255,255,.15);font-size:10px;margin-right:4px}
.workflow li.active .step-num{background:var(--lt);color:var(--dk)}

/* Tabs */
.tabs{display:flex;background:white;border-bottom:1px solid var(--border);padding:0 20px;gap:0;overflow-x:auto}
.tabs button{border:none;border-radius:0;background:none;padding:10px 16px;font-size:12px;font-weight:600;color:var(--text2);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button:hover{color:var(--dk)}
.tabs button.active{color:var(--blue);border-bottom-color:var(--blue)}

/* Main container */
.main{padding:20px 24px;max-width:1600px;margin:0 auto}
.tab-content{display:none}
.tab-content.active{display:block}

/* Cards / KPIs */
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:14px 16px;position:relative}
.kpi .label{font-size:11px;color:var(--text3);margin-bottom:4px;text-transform:uppercase;letter-spacing:.3px}
.kpi .value{font-size:22px;font-weight:700;color:var(--dk)}
.kpi .sub{font-size:11px;color:var(--text2);margin-top:2px}
.kpi.accent{border-left:4px solid var(--blue)}
.kpi.green{border-left:4px solid var(--prot)}
.kpi.amber{border-left:4px solid var(--disc)}
.kpi.red{border-left:4px solid var(--weak)}

/* Section cards */
.section{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:18px 20px;margin-bottom:20px}
.section h2{display:flex;align-items:center;gap:8px}
.section h2 .badge{font-size:10px;background:var(--mist);padding:2px 8px;border-radius:10px;font-weight:400}

/* Tables */
.tbl-wrap{overflow-x:auto;margin:0 -4px}
table{width:100%;border-collapse:collapse;font-size:12px}
table th{position:sticky;top:0;background:var(--dk);color:#fff;padding:8px 10px;text-align:left;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.3px;white-space:nowrap;z-index:2}
table td{padding:7px 10px;border-bottom:1px solid var(--border);vertical-align:top}
table tr:hover td{background:rgba(11,94,215,.03)}
table .num{text-align:right;font-variant-numeric:tabular-nums}
table .right{text-align:right}
table .center{text-align:center}
table .indent{padding-left:28px;color:var(--text2)}

/* Status pills */
.pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600;white-space:nowrap}
.pill-green{background:var(--protbg);color:var(--prot)}
.pill-amber{background:var(--discbg);color:#8B6914}
.pill-red{background:var(--weakbg);color:var(--weak)}
.pill-blue{background:var(--lt);color:var(--dk)}

/* Fund bar */
.fund-bar{display:flex;height:36px;border-radius:6px;overflow:hidden;margin:12px 0}
.fund-bar div{display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:600;transition:flex .3s;min-width:0;overflow:hidden;white-space:nowrap;padding:0 6px}

/* Filters row */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center}
.filters label{font-size:11px;color:var(--text2)}
.filters select{font-size:12px;padding:4px 8px}
.filters input[type=text]{font-size:12px;padding:4px 8px;width:200px}

/* Scenario presets */
.presets{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.presets button{font-size:11px;padding:5px 10px}
.presets button.selected{background:var(--dk);color:white;border-color:var(--dk)}

/* Slider row */
.slider-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:16px}
.slider-card{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:12px}
.slider-card .s-label{font-size:11px;color:var(--text2);margin-bottom:4px}
.slider-card .s-value{font-size:16px;font-weight:700;color:var(--dk);margin-bottom:6px}

/* Collapsible */
details{margin-bottom:8px}
details summary{cursor:pointer;font-weight:600;padding:6px 0;font-size:13px;color:var(--dk)}
details summary:hover{color:var(--blue)}

/* Conference */
.agenda-item{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.agenda-item .time{font-weight:700;color:var(--blue);min-width:60px;font-size:12px}
.agenda-item .desc{flex:1}
.agenda-item .desc h4{margin:0 0 2px;font-size:13px}
.agenda-item .desc p{margin:0;font-size:12px;color:var(--text2)}

/* Export button */
.export-btn{position:fixed;bottom:20px;right:20px;z-index:100;background:var(--dk);color:white;border:none;padding:10px 16px;border-radius:6px;font-size:12px;box-shadow:0 2px 10px rgba(0,0,0,.2)}
.export-btn:hover{background:var(--blue)}

/* Tooltip */
.tooltip{position:absolute;background:rgba(26,31,43,.92);color:#fff;padding:8px 12px;border-radius:6px;font-size:11px;pointer-events:none;z-index:200;max-width:280px;line-height:1.4;box-shadow:0 4px 12px rgba(0,0,0,.15)}

/* Finance recommended table */
.fin-table th{background:var(--blue)}
.fin-table td{font-weight:500}
.fin-table tr:last-child td{font-weight:700;background:rgba(11,94,215,.05)}

/* Bubble chart */
.bubble-chart{width:100%;height:380px;background:white;border:1px solid var(--border);border-radius:6px;position:relative;overflow:visible}

/* Sortable */
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{background:rgba(255,255,255,.1)}
th.sortable::after{content:' \25B4\25BE';font-size:8px;opacity:.5}
th.sortable.asc::after{content:' \25B4';opacity:1}
th.sortable.desc::after{content:' \25BE';opacity:1}

/* Responsive */
@media(max-width:1200px){
  .main{padding:16px}
  .kpi-row{grid-template-columns:repeat(3,1fr)}
}

/* Loading */
.loading{text-align:center;padding:60px;color:var(--text3)}
.loading .spin{display:inline-block;width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Scrollbar */
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--text3)}
</style>
</head>
<body>

<!-- Header -->
<div class="hdr">
  <h1>AOP 2027 <span style="opacity:.5">|</span> Philips IT One Portfolio Dashboard</h1>
  <span class="tag">v2.0</span>
  <span class="subtitle" id="headerSubtitle">Scenario: Optimal Segmentation | Status: Draft | Source: Sep 2026</span>
</div>

<!-- Workflow bar -->
<ol class="workflow" id="workflow">
  <li class="active" data-tab="0"><span class="step-num">1</span>Review One Portfolio</li>
  <li data-tab="1"><span class="step-num">2</span>Set Program Scenarios</li>
  <li data-tab="2"><span class="step-num">3</span>Review Enterprise Wide</li>
  <li data-tab="3"><span class="step-num">4</span>Review BU Led</li>
  <li data-tab="4"><span class="step-num">5</span>Review Operations</li>
  <li data-tab="5"><span class="step-num">6</span>Conference Prep</li>
</ol>

<!-- Tab buttons -->
<div class="tabs" id="tabBar">
  <button class="active" data-tab="0">One Portfolio</button>
  <button data-tab="1">Program Scenarios</button>
  <button data-tab="2">Enterprise Wide</button>
  <button data-tab="3">BU Led</button>
  <button data-tab="4">Operations</button>
  <button data-tab="5">Conferences</button>
</div>

<!-- Main content -->
<div class="main" id="app">
  <div class="loading" id="loadingMsg"><div class="spin"></div><p style="margin-top:12px">Loading portfolio data...</p></div>
</div>

<!-- Export button -->
<button class="export-btn" onclick="exportCSV()" title="Export current view as CSV">&#x2913; Export CSV</button>

<script>
// =========================================================================
// GLOBALS
// =========================================================================
let DATA = null;
let currentTab = 0;
let scenarioState = {
  budget: 100,
  sliders: { legalBudget: 15, sustainHygieneBudget: 20, carryBudget: 50, valueBudget: 15 },
  preset: 'optimal'
};

const STAGE_COLORS = ['#00126E','#0B5ED7','#008BA3','#226EB0','#70ADE0'];
const STAGE_NAMES = ['Legal & Compliance','Sustain Engineering','Hygiene','Carryover','Value Based'];

// =========================================================================
// DATA LOADING
// =========================================================================
async function loadData(){
  try {
    const r = await fetch('Data%20file/AOP2027-OnePortfolio-Data.json');
    if(!r.ok) throw new Error('HTTP '+r.status);
    DATA = await r.json();
    document.getElementById('loadingMsg').style.display='none';
    buildAllTabs();
    switchTab(0);
  } catch(e){
    document.getElementById('loadingMsg').innerHTML = '<p style="color:var(--weak)">Failed to load data: '+e.message+'</p><p style="font-size:12px">Ensure AOP2027-OnePortfolio-Data.json is in the Data file/ subfolder.</p>';
  }
}

// =========================================================================
// UTILITY FUNCTIONS
// =========================================================================
function fmt(v,d=1){ if(v==null||isNaN(v)) return '-'; return Number(v).toFixed(d); }
function fmtE(v,d=1){ return fmt(v,d)+' M€'; }
function pct(v,t){ return t?((v/t)*100).toFixed(1)+'%':'0%'; }
function esc(s){ if(!s) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function pillClass(status){
  if(!status) return 'pill-blue';
  const s=status.toLowerCase();
  if(s.includes('funded')||s.includes('green')||s==='funded') return 'pill-green';
  if(s.includes('partial')||s.includes('amber')) return 'pill-amber';
  return 'pill-red';
}

function makeKPI(label,value,sub,cls=''){
  return `<div class="kpi ${cls}"><div class="label">${esc(label)}</div><div class="value">${value}</div>${sub?'<div class="sub">'+sub+'</div>':''}</div>`;
}

// =========================================================================
// MERIT SCORING
// =========================================================================
function meritScore(p){
  let score = 0;
  // Benefit component (max 50)
  const ratio = (p.benefit && p.cost > 0) ? p.benefit / p.cost : 0;
  if(ratio >= 5) score += 50;
  else if(ratio >= 3) score += 40;
  else if(ratio >= 2) score += 30;
  else if(ratio >= 1) score += 20;
  else score += 0;

  // Priority component (max 25)
  const pri = (p.priority||'').toLowerCase().trim();
  if(pri === 'must do') score += 25;
  else if(pri === 'must have') score += 18;
  else if(pri === 'deprioritised') score += 5;

  // Consequence component (max 15)
  const imp = (p.impact||'');
  if(imp.length > 100) score += 15;
  else if(imp.length > 50) score += 10;
  else if(imp.length > 0) score += 5;

  // Decision Band (max 10)
  const db = (p.decisionBand||'').toUpperCase();
  if(db === 'HEALTHY') score += 10;
  else if(db === 'CONTAIN') score += 6;

  return score;
}

// =========================================================================
// STAGE CLASSIFICATION
// =========================================================================
const CCB_EXCEPTION_ORGS = ['finance','group functions','group functions & hyperautomation it','integrated supply chain','integrated supply chain & finance','isc'];

function isLFR(p){
  const cat = (p.category||'').toLowerCase();
  const overall = (p.overall||'').toUpperCase();
  return cat.includes('legal fiscal') || cat.includes('regulatory') || cat.includes('compliancy') ||
         overall.includes('MUST-DO') || overall.includes('P1') || overall.includes('P2');
}

function hasLFREvidence(p){
  return !!(p.lfrYear && p.lfrYear.trim()) && !!(p.lfrName && p.lfrName.trim());
}

function isCCBException(p){
  const org = (p.org||'').toLowerCase();
  const plat = (p.platform||'').toLowerCase();
  return CCB_EXCEPTION_ORGS.some(e => org.includes(e) || plat.includes(e));
}

function lfrPriority(p){
  const overall = (p.overall||'').toUpperCase();
  if(overall.includes('P1')) return 0;
  if(overall.includes('P2')) return 1;
  return 2;
}

function lfrSortKey(p){
  const pri = lfrPriority(p);
  const evidence = hasLFREvidence(p) ? 0 : 1;
  const ccb = isCCBException(p) ? 1 : 0;
  return pri * 1000 + evidence * 100 + ccb * 10 - (p.merit || 0);
}

function hasEvidence(p){
  return (p.benefit != null && p.benefit > 0) || (p.impact && p.impact.length > 10);
}

function classifyStage(p){
  const cat = (p.category||'').toLowerCase();
  const nc = (p.newCarry||'').toLowerCase();

  // Stage 0: True LFRs
  if(isLFR(p)) return 0;

  // Stage 1: Sustain Engineering
  if(nc.includes('change & sustain')) return 1;

  // Stage 2: Hygiene (CI and Upgrades & Enhancements)
  if(cat === 'continuous improvement' || cat.includes('continous improvement') ||
     cat === 'upgrades & enhancements') return 2;

  // Stage 3: Carryover — must be explicit carry-over, not decommissioning
  if(nc.includes('carry over') && !cat.includes('decomm') && !cat.includes('replatform')) return 3;

  // Stage 4: Value Based — everything else including decomm/replatforming and AI
  return 4;
}

// =========================================================================
// ALLOCATION ENGINE
// =========================================================================
function runAllocation(){
  const allPrograms = [...DATA.program.ew, ...DATA.program.bu];
  const budget = scenarioState.budget;
  const {legalBudget, sustainHygieneBudget, carryBudget, valueBudget} = scenarioState.sliders;

  // Classify and score all programs
  const programs = allPrograms.map(p => ({
    ...p,
    stage: classifyStage(p),
    merit: meritScore(p),
    funded: false,
    allocStage: -1,
    holdReason: '',
    _lfrSortKey: 0
  }));

  // Compute LFR sort keys
  programs.filter(p=>p.stage===0).forEach(p=>{ p._lfrSortKey = lfrSortKey(p); });

  // Stage demands
  const stageDemands = [0,0,0,0,0];
  programs.forEach(p => { stageDemands[p.stage] += p.cost; });

  // Stage budget caps (directional from finance recommendation)
  const stageCaps = [
    Math.min(legalBudget, budget),
    Math.min(sustainHygieneBudget, budget),
    0, // Hygiene shares the sustainHygiene budget (see below)
    Math.min(carryBudget, budget),
    Math.min(valueBudget, budget)
  ];

  let remaining = budget;

  // ── STAGE 0: TRUE LFRs (directional €15M) ──
  // P1 obligations first, then P2, then CCB exceptions
  // Within each tier: prefer records with LFR name/year evidence
  const lfrCap = Math.min(stageCaps[0], remaining);
  const lfrPrograms = programs.filter(p=>p.stage===0).sort((a,b)=>a._lfrSortKey - b._lfrSortKey);
  let usedLfr = 0;
  lfrPrograms.forEach(p=>{
    if(!hasEvidence(p) && !isLFR(p)){
      p.holdReason = 'Missing evidence — held for explicit review';
      return;
    }
    if(usedLfr + p.cost <= lfrCap + 0.001){
      p.funded = true;
      p.allocStage = 0;
      usedLfr += p.cost;
    }
  });
  remaining -= usedLfr;

  // ── STAGE 1+2: SUSTAIN + HYGIENE (directional €20M) ──
  // Fund full eligible Sustain first; remaining to Hygiene
  const shCap = Math.min(stageCaps[1], remaining);
  let usedSH = 0;

  // Sustain first
  const sustainPgms = programs.filter(p=>p.stage===1).sort((a,b)=>b.merit-a.merit);
  sustainPgms.forEach(p=>{
    if(!hasEvidence(p)){
      p.holdReason = 'Missing evidence — held for explicit review';
      return;
    }
    if(usedSH + p.cost <= shCap + 0.001){
      p.funded = true;
      p.allocStage = 1;
      usedSH += p.cost;
    }
  });

  // Hygiene with remaining Sustain+Hygiene budget
  const hygienePgms = programs.filter(p=>p.stage===2).sort((a,b)=>b.merit-a.merit);
  hygienePgms.forEach(p=>{
    if(!hasEvidence(p)){
      p.holdReason = 'Missing evidence — held for explicit review';
      return;
    }
    if(usedSH + p.cost <= shCap + 0.001){
      p.funded = true;
      p.allocStage = 2;
      usedSH += p.cost;
    }
  });
  remaining -= usedSH;

  // ── STAGE 3: CARRYOVERS (directional €50M) ──
  // Must be data-backed (benefit or payback or impact evidence)
  const carryCap = Math.min(stageCaps[3], remaining);
  const carryPgms = programs.filter(p=>p.stage===3).sort((a,b)=>{
    // Rank by: benefit ratio desc, then payback presence, then impact strength, then merit
    const rA = (a.benefit && a.cost>0) ? a.benefit/a.cost : 0;
    const rB = (b.benefit && b.cost>0) ? b.benefit/b.cost : 0;
    if(rB !== rA) return rB - rA;
    const pA = a.payback ? 1 : 0;
    const pB = b.payback ? 1 : 0;
    if(pB !== pA) return pB - pA;
    return b.merit - a.merit;
  });
  let usedCarry = 0;
  carryPgms.forEach(p=>{
    const dataEvidence = (p.benefit != null && p.benefit > 0) || (p.payback && p.payback.trim()) || (p.impact && p.impact.length > 10);
    if(!dataEvidence){
      p.holdReason = 'Missing data-backed evidence (benefit/payback/impact) — held for explicit review';
      return;
    }
    if(usedCarry + p.cost <= carryCap + 0.001){
      p.funded = true;
      p.allocStage = 3;
      usedCarry += p.cost;
    }
  });
  remaining -= usedCarry;

  // ── STAGE 4: VALUE BASED / LARGE IMPACTFUL (directional €15M) ──
  // Strongest evidence in remaining capacity
  const valueCap = Math.min(stageCaps[4], remaining);
  const valuePgms = programs.filter(p=>p.stage===4).sort((a,b)=>{
    // Evidence strength first, then merit
    const eA = ((a.benefit!=null&&a.benefit>0)?2:0) + ((a.impact&&a.impact.length>30)?1:0);
    const eB = ((b.benefit!=null&&b.benefit>0)?2:0) + ((b.impact&&b.impact.length>30)?1:0);
    if(eB !== eA) return eB - eA;
    return b.merit - a.merit;
  });
  let usedValue = 0;
  valuePgms.forEach(p=>{
    if(!hasEvidence(p)){
      p.holdReason = 'Missing evidence — held for explicit review';
      return;
    }
    if(usedValue + p.cost <= valueCap + 0.001){
      p.funded = true;
      p.allocStage = 4;
      usedValue += p.cost;
    }
  });

  // Calculate totals
  const funded = programs.filter(p=>p.funded);
  const unfunded = programs.filter(p=>!p.funded);
  const held = programs.filter(p=>!p.funded && p.holdReason);
  const stageAllocated = [0,0,0,0,0];
  funded.forEach(p => { stageAllocated[p.allocStage] += p.cost; });

  return { programs, funded, unfunded, held, stageDemands, stageAllocated, budget };
}

// =========================================================================
// TAB SWITCHING
// =========================================================================
function switchTab(idx){
  currentTab = idx;
  document.querySelectorAll('.tabs button').forEach((b,i)=>{
    b.classList.toggle('active', i===idx);
  });
  document.querySelectorAll('.workflow li').forEach((li,i)=>{
    li.classList.toggle('active', i===idx);
  });
  document.querySelectorAll('.tab-content').forEach((tc,i)=>{
    tc.classList.toggle('active', i===idx);
  });
}

// Tab bar click handlers
document.getElementById('tabBar').addEventListener('click', e=>{
  const btn = e.target.closest('button[data-tab]');
  if(btn) switchTab(+btn.dataset.tab);
});
document.getElementById('workflow').addEventListener('click', e=>{
  const li = e.target.closest('li[data-tab]');
  if(li) switchTab(+li.dataset.tab);
});

// =========================================================================
// BUILD ALL TABS
// =========================================================================
function buildAllTabs(){
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="tab-content active" id="tab0"></div>
    <div class="tab-content" id="tab1"></div>
    <div class="tab-content" id="tab2"></div>
    <div class="tab-content" id="tab3"></div>
    <div class="tab-content" id="tab4"></div>
    <div class="tab-content" id="tab5"></div>
  `;
  buildTab0();
  buildTab1();
  buildTab2();
  buildTab3();
  buildTab4();
  buildTab5();
}

  el.innerHTML = html;

function applyPreset(name){
  scenarioState.preset = name;
  switch(name){
    case 'optimal':
      // Finance recommended: LFR 15, Sustain+Hygiene 20, Carryovers 50, Value/Large 15
      scenarioState.sliders = {legalBudget:15,sustainHygieneBudget:20,carryBudget:50,valueBudget:15};
      scenarioState.budget = 100;
      break;
    case 'protect':
      // Protect all commitments: maximize LFR and Sustain, compress Value
      scenarioState.sliders = {legalBudget:20,sustainHygieneBudget:23,carryBudget:50,valueBudget:7};
      scenarioState.budget = 100;
      break;
    case 'tighten':
      // Tighten carryover: reduce carry, give more to evidence-backed value
      scenarioState.sliders = {legalBudget:15,sustainHygieneBudget:20,carryBudget:40,valueBudget:25};
      scenarioState.budget = 100;
      break;
    case 'release':
      // Release sustain: reduce sustain+hygiene, give to carryover
      scenarioState.sliders = {legalBudget:15,sustainHygieneBudget:12,carryBudget:58,valueBudget:15};
      scenarioState.budget = 100;
      break;
  }
  const presetLabels = {optimal:'Optimal Segmentation (Recommended)',protect:'Protect Commitments',tighten:'Tighten Carryover Evidence',release:'Release Sustain Capacity'};
  document.getElementById('headerSubtitle').textContent = 'Scenario: '+presetLabels[name]+' | Status: Draft | Source: Sep 2026';
  renderScenario();
  buildTab0();
}

// =========================================================================
// BUBBLE CHART
// =========================================================================
function drawBubbleChart(svgId, programs, fundedIds){
  const svg = document.getElementById(svgId);
  if(!svg) return;
  const W = 800, H = 380, PAD = {top:20,right:30,bottom:45,left:55};
  const cw = W - PAD.left - PAD.right;
  const ch = H - PAD.top - PAD.bottom;

  const maxMerit = 100;
  const costs = programs.map(p=>p.cost).filter(c=>c>0);
  const maxCost = Math.max(...costs, 1);
  const minCost = Math.min(...costs, 0.01);

  function xScale(merit){ return PAD.left + (merit/maxMerit)*cw; }
  function yScale(cost){
    if(cost <= 0) cost = 0.01;
    const logMin = Math.log10(minCost);
    const logMax = Math.log10(maxCost);
    const logVal = Math.log10(cost);
    const t = logMax > logMin ? (logVal - logMin)/(logMax - logMin) : 0.5;
    return PAD.top + ch - t*ch;
  }
  function rScale(cost){ return Math.max(4, Math.min(25, Math.sqrt(cost)*8)); }

  let svgContent = '';

  // Grid lines
  for(let i=0;i<=5;i++){
    const x = PAD.left + (i/5)*cw;
    svgContent += `<line x1="${x}" y1="${PAD.top}" x2="${x}" y2="${PAD.top+ch}" stroke="#e8edf2" stroke-width="1"/>`;
    svgContent += `<text x="${x}" y="${H-8}" text-anchor="middle" font-size="10" fill="#8895a7">${(i*20)}</text>`;
  }
  for(let i=0;i<=4;i++){
    const y = PAD.top + (i/4)*ch;
    svgContent += `<line x1="${PAD.left}" y1="${y}" x2="${PAD.left+cw}" y2="${y}" stroke="#e8edf2" stroke-width="1"/>`;
    const costVal = Math.pow(10, Math.log10(maxCost) - (i/4)*(Math.log10(maxCost)-Math.log10(minCost)));
    svgContent += `<text x="${PAD.left-8}" y="${y+4}" text-anchor="end" font-size="10" fill="#8895a7">${fmt(costVal,1)}</text>`;
  }

  // Axis labels
  svgContent += `<text x="${PAD.left+cw/2}" y="${H-2}" text-anchor="middle" font-size="11" fill="#4a5568">Merit Score</text>`;
  svgContent += `<text x="14" y="${PAD.top+ch/2}" text-anchor="middle" font-size="11" fill="#4a5568" transform="rotate(-90,14,${PAD.top+ch/2})">Cost M€ (log)</text>`;

  // Bubbles
  programs.forEach(p => {
    if(p.cost <= 0) return;
    const cx = xScale(p.merit);
    const cy = yScale(p.cost);
    const r = rScale(p.cost);
    const isFunded = fundedIds.has(p.id);
    const color = isFunded ? 'var(--blue)' : 'var(--weak)';
    const opacity = isFunded ? 0.7 : 0.4;
    svgContent += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${color}" opacity="${opacity}" stroke="${isFunded?'var(--dk)':'var(--weak)'}" stroke-width="1">
      <title>${esc(p.id)}: ${esc(p.name)}\nCost: ${fmt(p.cost)} M€ | Merit: ${p.merit}\nStatus: ${isFunded?'Funded':'Unfunded'}</title>
    </circle>`;
  });

  svg.innerHTML = svgContent;
}

function buildFunctionBriefings(){
  const container = document.getElementById('functionBriefings');
  if(!container) return;

  const res = runAllocation();
  const fundedIds = new Set(res.funded.filter(p=>p.stream==='ew').map(p=>p.id));

  // Map function names to org values in EW data
  const functionMap = {
    'Greater China (GRC)': ['Greater China'],
    'Innovation and Design': ['Innovation and Design Business Operations'],
    'Medical Office': ['Medical Office'],
    'Patient Safety & Quality (PSQ)': ['Patient Safety & Quality'],
    'People Function': ['People function'],
    'Finance': ['Finance'],
    'Group Security': ['Group Security'],
    'ESG & Legal, Health & Safety': ['Legal', 'Health & Safety'],
    'Intellectual Property & Standards': ['Intellectual Property & Standards (IP&S)'],
    'Communications & Brand': ['Communications & Brand'],
    'Internal Audit': ['Internal Audit '],
    'Information Technology (IT)': ['Information Technology '],
    'International Market (IM)': ['International Regions (IR) - Overall'],
    'North America (NAM)': ['North America']
  };

  let html = '';
  Object.keys(functionMap).forEach(func => {
    const orgKeys = functionMap[func];
    const progs = DATA.program.ew.filter(p => orgKeys.some(k => p.org && p.org.includes(k)));
    if(progs.length === 0) return;

    const totalCost = progs.reduce((s,p)=>s+p.cost,0);
    const fundedProgs = progs.filter(p=>fundedIds.has(p.id));
    const fundedCost = fundedProgs.reduce((s,p)=>s+p.cost,0);

    html += `<details><summary>${esc(func)} <span class="badge">${progs.length} programs | ${fmtE(totalCost)} demand | ${fmtE(fundedCost)} funded</span></summary>`;
    html += `<table><tr><th>ID</th><th>Name</th><th class="num">Cost M€</th><th class="num">Benefit M€</th><th>Priority</th><th>Status</th></tr>`;
    progs.sort((a,b)=>meritScore(b)-meritScore(a)).forEach(p=>{
      const isFunded = fundedIds.has(p.id);
      html += `<tr><td>${esc(p.id)}</td><td>${esc(p.name)}</td><td class="num">${fmt(p.cost)}</td><td class="num">${p.benefit!=null?fmt(p.benefit):'-'}</td><td>${esc(p.priority)}</td><td><span class="pill ${isFunded?'pill-green':'pill-red'}">${isFunded?'Funded':'Unfunded'}</span></td></tr>`;
    });
    html += `</table></details>`;
  });

  container.innerHTML = html;
}

// =========================================================================
// SORTABLE TABLE HEADERS
// =========================================================================
function attachSortHandlers(tableId){
  const table = document.getElementById(tableId);
  if(!table) return;
  table.querySelectorAll('th.sortable').forEach(th => {
    th.addEventListener('click', function(){
      const col = this.dataset.col;
      const isAsc = this.classList.contains('asc');
      // Reset all
      table.querySelectorAll('th.sortable').forEach(h=>{h.classList.remove('asc','desc')});
      this.classList.add(isAsc?'desc':'asc');

      const tbody = table.querySelector('tbody') || table;
      const rows = Array.from(tbody.querySelectorAll('tr')).filter(r=>r.querySelector('td'));
      const colIdx = Array.from(th.parentElement.children).indexOf(th);
      const isNum = th.classList.contains('num');
      const dir = isAsc ? -1 : 1;

      rows.sort((a,b)=>{
        let va = a.children[colIdx]?.textContent?.trim() || '';
        let vb = b.children[colIdx]?.textContent?.trim() || '';
        if(isNum){
          va = parseFloat(va.replace(/[^\d.\-]/g,'')) || 0;
          vb = parseFloat(vb.replace(/[^\d.\-]/g,'')) || 0;
          return (va - vb) * dir;
        }
        return va.localeCompare(vb) * dir;
      });

      rows.forEach(r => tbody.appendChild(r));
    });
  });
}

function exportCSV(){
  const tabNames = ['OnePortfolio','ProgramScenarios','EnterpriseWide','BULed','Operations','Conferences'];
  const tabEl = document.querySelector('.tab-content.active');
  if(!tabEl) return;

  // Find the first visible table
  const table = tabEl.querySelector('table');
  if(!table){
    alert('No table data found in current view.');
    return;
  }

  let csv = '';
  const rows = table.querySelectorAll('tr');
  rows.forEach(row=>{
    const cells = row.querySelectorAll('th, td');
    const vals = Array.from(cells).map(c=>{
      let v = c.textContent.trim().replace(/"/g,'""');
      return '"'+v+'"';
    });
    csv += vals.join(',') + '\n';
  });

  const blob = new Blob(['﻿'+csv], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'AOP2027-'+tabNames[currentTab]+'-export.csv';
  a.click();
  URL.revokeObjectURL(url);
}
