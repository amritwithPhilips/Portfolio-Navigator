name: Deploy AOP 2027 Navigator

on:
  push:
    branches: [main]
    paths:
      - 'AOP 2027 Modeler/**'
      - 'azure-deploy/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy
    steps:
      - uses: actions/checkout@v4

      - name: Prepare app output
        run: |
          mkdir -p _site
          cp "AOP 2027 Modeler/AOP2027-IT-Portfolio-Scenario-Modelling-v7.10.26-r1.html" _site/index.html
          cp azure-deploy/staticwebapp.config.json _site/

      - name: Install API dependencies
        run: cd azure-deploy/api && npm ci

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: _site
          api_location: azure-deploy/api
          skip_app_build: true
