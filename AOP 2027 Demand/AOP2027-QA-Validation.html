<style>
:root{--dk:#00126e;--blue:#2563eb;--lt:#e6efff;--mist:#e5e7eb;--card:#fff;--border:#d1d5db;--text:#1e293b;--text2:#64748b;--text3:#94a3b8;--pass:#059669;--fail:#dc2626;--bg:#f8fafc;--passbg:#dcfce7;--failbg:#fee2e2}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:13px;line-height:1.5}
header{background:var(--dk);color:#fff;padding:20px 32px;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:20px;font-weight:700;letter-spacing:0.5px}
.badge{display:inline-block;padding:4px 16px;border-radius:20px;font-size:14px;font-weight:700;margin-left:16px}
.badge-pass{background:var(--passbg);color:var(--pass)}.badge-fail{background:var(--failbg);color:var(--fail)}
.toolbar{display:flex;gap:10px;padding:16px 32px;background:#fff;border-bottom:1px solid var(--mist);align-items:center}
.toolbar button{padding:8px 20px;border:1px solid var(--border);border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;background:var(--dk);color:#fff}
.toolbar button:hover{opacity:.9}
.toolbar .btn-sec{background:#fff;color:var(--dk)}
.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;padding:20px 32px}
.suite-card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:16px;cursor:pointer;transition:box-shadow .15s}
.suite-card:hover{box-shadow:0 2px 8px rgba(0,0,0,.08)}
.suite-card h3{font-size:13px;color:var(--dk);margin-bottom:8px;font-weight:700}
.suite-card .ratio{font-size:24px;font-weight:800}
.suite-card .ratio.all-pass{color:var(--pass)}.suite-card .ratio.has-fail{color:var(--fail)}
.suite-card .bar{height:6px;background:var(--mist);border-radius:3px;margin-top:10px;overflow:hidden}
.suite-card .bar-fill{height:100%;border-radius:3px;transition:width .3s}
.suite-card small{color:var(--text3);font-size:11px;display:block;margin-top:6px}
main{padding:0 32px 32px}
.suite{margin-bottom:16px;border:1px solid var(--border);border-radius:8px;background:#fff;overflow:hidden}
.suite-header{padding:14px 20px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none}
.suite-header:hover{background:var(--lt)}
.suite-header h2{font-size:14px;font-weight:700;color:var(--dk);display:flex;align-items:center;gap:8px}
.suite-header .arrow{transition:transform .2s;font-size:10px;color:var(--text3)}
.suite-header .arrow.open{transform:rotate(90deg)}
.suite-header .stat{font-size:13px;font-weight:700}
.suite-body{display:none;border-top:1px solid var(--mist)}
.suite-body.open{display:block}
table{width:100%;border-collapse:collapse;font-size:12px}
th{background:#f1f5f9;padding:8px 12px;text-align:left;font-weight:600;font-size:11px;color:var(--dk);position:sticky;top:0}
td{padding:7px 12px;border-bottom:1px solid var(--mist);vertical-align:top}
td.wrap{white-space:normal;max-width:250px}
tr:nth-child(even){background:#fafbfd}
.pass-cell{color:var(--pass);font-weight:700}.fail-cell{color:var(--fail);font-weight:700}
.tag{display:inline-block;padding:2px 10px;border-radius:10px;font-size:10px;font-weight:700}
.tag-pass{background:var(--passbg);color:var(--pass)}.tag-fail{background:var(--failbg);color:var(--fail)}
.mono{font-family:'Cascadia Code','Fira Code',monospace;font-size:11px}
footer{text-align:center;padding:20px;color:var(--text3);font-size:11px;border-top:1px solid var(--mist);margin-top:30px}
#status{padding:12px 32px;font-size:12px;color:var(--text2)}
</style>
</head>

ims, disputes and rebates and engage enterprise architecture early.\n• Map integrations & data model across Vistex, SAP and customer portals (customer, invoice, claim, dispute entities)."},{"id":"Bu-285","planisware":"","org":"Personal Health (PH)","name":"27.2 RGM Decision Engine | Promo Effectiveness & Trade Spend Mix Simulator","type":"Type I - Single BU","newCarry":"New Initiative","category":"New Feature","platform":"Innovation and Digital IT","area":"Revenue Increase","bigBets":"1. AI","cost":0.9,"benefit":null,"impact":"Teams will continue making manual, backward-looking decisions, resulting in sub-optimal promotional ROI, inefficient trade-spend allocation, delayed overspend visibility, and missed growth and margin opportunities.","payback":"","priority":"Must Do","overall":"","decisionBand":"","stream":"bu","problem":"Current State: Promotions and trade spend are managed manually through Excel, with limited visibility into sales lift, ROI, profitability impact, and future scenarios. Trade investments are often optimized in silos, with overspend risks identified only after the fact. Desired State: An integrated RGM Analytics & Simulation Platform that connects pricing, promotion, portfolio, mix, and trade investments into a single decision engine. The platform will enable scenario planning, automated P&Ls, AI-driven analytics, and optimization recommendations to maximize growth, profitability, and PPWF%. Impact if Not Approved: Teams will continue making manual, backward-looking decisions, resulting in sub-optimal promotional ROI, inefficient trade-spend","scope":"Unified RGM data layer integrating Vistex, RGM, GfK, RSD, and commercial data sources.\nAutomated P&Ls, RGM dashboards, AI insights, and scenario planning across Pricing, Promotion, Portfolio, Mix, and Trade Investments.\nPromo Effectiveness, discount optimization, and trade-spend optimization engines.\nPilot in NAR and Growth, followed by scalable global deployment.\nIntroduce new AI Pricing Operating Model/Line chart optimization"},{"id":"Bu-286","planisware":"","org":"Personal Health (PH)","name":"3PL Transformation (Dual 3PL ) - India","type":"Type I - Single BU","newCarry":"New Initiative","category":"New Feature","platform":"Integrated Supply Chain & Finance","area":"Revenue Increase","bigBets":"","cost":0.175,"benefit":1.939,"impact":"Strategic distribution capability","payback":"","priority":"Must Have","overall":"","decisionBand":"","stream":"bu","problem":"Data transfer & receiving (data sharing) from new 3PL WMS and Philips SAP/Infodis  to Logistics partner portals and vise-versa like Customer delivery location – Ship to , packages in the shipment – number of boxes , invoice details for LR and E-way bill generation)\nThis data is a signal for 3PL to plan and schedule the delivery as per customer appointments. 3PL has to deliver orders to maintain KPIs- Fill Rates, OTIF, POCR\nChallenges with existing 3PL – delayed deliveries, incorrect deliveries, ICS compliance misses, high returns, quality issues resulting in high customer claims. Negligible response on new age technology implementation.","scope":"1st 3PL onboarding in Q2 (no system integrations needed), 2nd 3PL onboarding in Q3 (system integration needed)"},{"id":"Bu-287","planisware":"","org":"Personal Health (PH)","name":"72. O2C simplification: Smart Allocation & Agentic AI","type":"Type I - Single BU","newCarry":"Carry Over","category":"AI Enablement","platform":"Integrated Supply Chain & Finance","area":"Revenue Increase","bigBets":"1. AI","cost":1.08,"benefit":0.42,"impact":"Order Management will remain highly manual and fragmented, limiting touchless processing, productivity gains, scalable execution, and customer experience.","payback":"","priority":"Must Do","overall":"","decisionBand":"","stream":"bu","problem":"Shift O2C operations from transactional processing to agentic, exception-based customer operations orchestration. The objective is to scale and embed an agentic AI- and automat ol, the 18 mth PIPO file, the global Line chart. These are created from a different functional access (PLM, ISC, RGM), containing duplicate data and hand overs to the other functions. This leads to manual data input, and wrong data. Connecting these tools and data prevents cost in data management, cost of obsolescence and unnecessary work by product managers. It also includes using AI agents for data analysis and decision support.\nThe objective is to create a single connected and intelligent tool for all product portfolio management related tasks E2E in CMM/PLM/ISC/RGM. It brings systems of records together through ADL and dashboards","scope":"Define data elements and sources with PLM, ISC, RGM\nBuild data repository for Product Portfolio management\nBuild user interface for Product Portfolio management\nDefine and Scope AI agents\nGradual deployment to key users\nScope for 2028: Build AI agents and full deployment"},{"id":"Bu-301","planisware":"","org":"Personal Health (PH)","name":"Enabling marketing content automation: E2E Claims digitalization","type":"Type I - Single BU","newCarry":"New Initiative","category":"New Feature","platform":"Innovation and Digital IT","area":"Productivity savings","bigBets":"","cost":0.2,"benefit":0.15,"impact":"90k in penalties and legal fees for using wrong claim per year (OneBlade example in Sweden) -> Happens every 2 years, 45k per year","payback":"","priority":"Must Have","overall":"","decisionBand":"","stream":"bu","problem":"Claims are leveraged across all marketing touchpoints, including packaging, PDP’s, website, etc. Therefore, in order to digitalize/automate the workflow of any of these touchpoint processes, automating the claims flow first is essential.\n\nCurrent state: claims are managed through multiple sources of truth (DOORS, ACL Excel, asset template Excel, Windchill/PAL references) with manual document-based approvals. Final global claims in PAL, after this no clear visibility. This creates compliance risk, missed   const explicit=/\b(cannot|unable|not able|will (?:not|lose|fail)|loss of|revenue (?:loss|at risk)|penalt\w*|non[- ]?complian\w*|end of (?:life|support)|out of support|downtime|disrupt\w*|delayed|forfeit|no longer|security breach\w*)\b/i.test(evidence);
  const affected=/\b(customer\w*|patient\w*|user\w*|business|product\w*|system\w*|platform\w*|operation\w*|revenue|audit\w*|compliance|manufactur\w*|service\w*|support|process\w*)\b/i.test(evidence);
  const reach=/\b(global|enterprise|company[- ]wide|worldwide|multi[- ]region|all regions|all markets)\b/i.test(evidence);
  const quantified=/\d[\d,.]*\s*(%|fte|hours?|days?|k€|m€|eur|million|sites?)\b/i.test(evidence)||/(?:€|EUR)\s*\d/.test(evidence);
  let points=fields.length?5:0;
  if(explicit&&affected)points=(reach||quantified)?15:10;
  return{points,fieldCount:fields.length};
}

function enrich(r,s){
  const st=stage(r);
  const ratio=r.cost>0&&numeric(r.benefit)!==null?r.benefit/r.cost:null;
  const c=consequence(r);
  let bp,benefitSource,qb=null;
  if(ratio!==null){bp=ratio<1?0:ratio<3?15:ratio<5?25:ratio<7?35:50;benefitSource='quantitative';}
  else if(REVPROD_RE.test(r.benefitDetails||'')){bp=0;benefitSource='revenue-prod-unquantified';}
  else{qb=qualitativeBenefit(r);bp=qb.points;benefitSource=qb.points>0?'qualitative':'none';}
  const pp=key(r.priority)==='must do'?25:key(r.priority)==='must have'?18:key(r.priority).startsWith('deprior')?5:0;
  const dp=key(r.decisionBand)==='healthy'?10:key(r.decisionBand)==='contain'?6:0;
  const pk=(r.paybackYears||0)<=0?0:(r.paybackYears||99)<=1?10:r.paybackYears<=2?8:r.paybackYears<=3?6:r.paybackYears<=5?4:0;
  const raw=[bp,pp,c.points,dp,pk];
  const components=raw.map((v,i)=>round(v/MAX_RAW[i]*s.weights[i]));
  const score=round(components.reduce((a,b)=>a+b,0));
  const holds=[];
  if(!r.name)holds.push('Program name missing');
  if(!(r.cost>0))holds.push(r.cost===null?'Requested demand missing':'No positive requested demand');
  const d=key(r.overall);
  if(d&&d.includes('priority tbd'))holds.push('Mandatory priority TBD');
  if(st===3&&r.benefit===null&&benefitSource==='none')holds.push('No benefit evidence');
  if(st===3&&r.benefit!==null&&r.benefit<0)holds.push('Negative benefit needs review');
  if(st===1&&s.carry>0&&ratio!==null&&ratio<s.carry)holds.push('Below carry-over threshold');
  if(st===3&&score<s.merit)holds.push('Below advanced merit floor');
  const isBaselinedCarry=st===1;
  const carryFundCap=isBaselinedCarry?Math.min(r.cost,r.baselined||0):null;
  return{...r,stage:st,stageName:STAGES[st],ratio,rawComponents:raw,components,score,benefitSource,qualTier:qb?qb.tier:'',holds,eligible:!holds.length,isBaselinedCarry,carryFundCap};
}

function compare(a,b){
  if(a.stage!==b.stage)return a.stage-b.stage;
  if(a.stage===1)return(b.ratio??-Infinity)-(a.ratio??-Infinity)||b.score-a.score;
  if(a.stage===2){const st=r=>key(r.newCarry)==='change & sustain'?0:1;const x=st(a)-st(b);if(x)return x;return b.score-a.score;}
  return b.score-a.score||a.id.localeCompare(b.id,'en',{numeric:true});
}

function leverTarget(s,k,demand){const v=s[k];if(!v||typeof v!=='object')return demand;return Math.min(demand,v.basis==='amount'?(v.amount||0):(v.basis==='bucket'?demand:s.budget)*v.pct/100);}

function solve(allRecords,s,overrides){
  overrides=overrides||{};
  const rows=allRecords.map(r=>enrich(r,s)).sort(compare);
  const demand=STAGES.map((_,i)=>round(rows.filter(r=>r.stage===i).reduce((a,r)=>a+(r.cost||0),0)));
  const targets=[leverTarget(s,'lfr',demand[0]),null,leverTarget(s,'sustain',demand[2]),leverTarget(s,'value',demand[3])];
  const spent=[0,0,0,0],rank=[0,0,0,0];let automatic=0;
  const residual=()=>Math.max(0,round(s.budget*(1+s.tolerance/100)-spent.slice(0,3).reduce((a,b)=>a+b,0)));
  const valueTarget=()=>targets[3]!==null?Math.min(residual(),targets[3]*(1+s.tolerance/100)):residual();
  for(const r of rows){
    r.rank=++rank[r.stage];r.automatic=0;r.reason=r.holds.join('; ');
    if(r.eligible){
      const stageLimit=r.stage===3?valueTarget():targets[r.stage]===null?Infinity:Math.min(demand[r.stage],targets[r.stage]*(1+s.tolerance/100));
      if(spent[r.stage]+r.cost>stageLimit+1e-9)r.reason='Does not fit stage target';
      else if(automatic+r.cost>s.budget*(1+s.tolerance/100)+1e-9)r.reason='Does not fit Total AOP';
      else{r.automatic=r.stage===1&&r.carryFundCap!==null?r.carryFundCap:r.cost;spent[r.stage]+=r.automatic;automatic+=r.automatic;r.reason='Funded';}
    }
    const o=overrides[r.id];r.final=r.automatic;r.override=o||null;
    if(o){if(o.choice==='exclude'){r.final=0;r.reason='Manual exclusion';}
      else if(o.choice==='include'){r.final=round(o.amount!=null?o.amount:r.cost);r.reason='Manual inclusion';}}
    r.unfunded=r.cost===null?null:round(r.cost-r.final);
    r.status=r.final>0?(r.final<r.cost?'Partial scope':'Funded'):(o&&o.choice==='exclude'?'Excluded':'Not funded');
  }
  const allocation=round(rows.reduce((a,r)=>a+(r.final||0),0));
  const requested=round(rows.reduce((a,r)=>a+(r.cost||0),0));
  const unfunded=round(rows.reduce((a,r)=>a+(r.unfunded||0),0));
  const count=rows.filter(r=>r.final>0).length;
  return{rows,totals:{requested,allocation,unfunded,count},stages:STAGES.map((name,i)=>({name,demand:demand[i],count:rows.filter(r=>r.stage===i).length,funded:rows.filter(r=>r.stage===i&&r.final>0).length,allocation:round(rows.filter(r=>r.stage===i).reduce((a,r)=>a+(r.final||0),0))})),streams:{ew:{requested:round(rows.filter(r=>r.stream==='ew').reduce((a,r)=>a+(r.cost||0),0)),allocation:round(rows.filter(r=>r.stream==='ew').reduce((a,r)=>a+(r.final||0),0))},bu:{requested:round(rows.filter(r=>r.stream==='bu').reduce((a,r)=>a+(r.cost||0),0)),allocation:round(rows.filter(r=>r.stream==='bu').reduce((a,r)=>a+(r.final||0),0))}}};
}

  r.push(T('Invariant: scores 0–100','All rows',true,()=>d.rows.every(row=>row.score>=-0.001&&row.score<=100.001)));
  r.push(T('Invariant: stage 0 first','budget>0',true,()=>[d,tol,m0].every(sc=>{const s0=sc.stages[0];return s0.allocation>=s0.demand-0.01||sc.totals.allocation>=sc.totals.requested-0.01;})));
  r.push(T('Invariant: EW+BU = total','All scenarios',true,()=>scenarios.every(sc=>Math.abs(sc.streams.ew.allocation+sc.streams.bu.allocation-sc.totals.allocation)<0.02)));
  const excl=solve(ALL,defaults(),{'EW-01':{choice:'exclude'}});
  r.push(T('Manual exclude: EW-01 final=0','exclude',0,()=>excl.rows.find(x=>x.id==='EW-01').final));
  const uf=d.rows.find(x=>x.final===0&&x.cost>0&&x.eligible);
  if(uf){
    const incl=solve(ALL,defaults(),{[uf.id]:{choice:'include',amount:uf.cost}});
    r.push(T('Manual include: funded',uf.id,true,()=>incl.rows.find(x=>x.id===uf.id).final>0));
    const half=round(uf.cost/2);
    const partial=solve(ALL,defaults(),{[uf.id]:{choice:'include',amount:half}});
    r.push(T('Manual partial: 50%',uf.id,true,()=>Math.abs(partial.rows.find(x=>x.id===uf.id).final-half)<0.001));
  } else {
    r.push(T('Manual include','No item',true,()=>true));
    r.push(T('Manual partial','No item',true,()=>true));
  }
  r.push(T('Preset round-trip','4 presets',true,()=>{try{['optimal','protect','evidence','capacity'].forEach(p=>solve(ALL,preset(p)));return true;}catch(e){return e.message;}}));
  return r;
}

// ═══ SUITE 6: CROSS-VALIDATION ═══
function suite6(){
  const r=[];const s=defaults();
  const enriched=ALL.map(x=>enrich(x,s));
  r.push(T('EW demand = meta.ewTotal','engine vs 111.7',true,()=>approx(round(enriched.filter(x=>x.stream==='ew').reduce((a,x)=>a+(x.cost||0),0)),META.ewTotal)));
  r.push(T('BU demand = meta.buTotal','engine vs 170.6',true,()=>approx(round(enriched.filter(x=>x.stream==='bu').reduce((a,x)=>a+(x.cost||0),0)),META.buTotal)));
  r.push(T('Stage 0 count = 12','engine',12,()=>enriched.filter(x=>x.stage===0).length));
  r.push(T('Stage 2 count = 161','engine',161,()=>enriched.filter(x=>x.stage===2).length));
  r.push(T('Stage 3 count = 350','engine',350,()=>enriched.filter(x=>x.stage===3).length));
  const topScorer=[...enriched].sort((a,b)=>b.score-a.score)[0];
  r.push(T('Top scorer ≥ 85','Highest',true,()=>topScorer.score>=85));
  r.push(T('Ops total = meta.opsTotal2027','469.7',true,()=>approx(round(OPS.reduce((a,x)=>a+(x.cost2027||0),0)),META.opsTotal2027)));
  r.push(T('No unresolved IT- platforms','All items',true,()=>enriched.map(x=>normalizePlatform(x.platform)).filter(p=>p.startsWith('IT-')).length===0));
  r.push(T('Distinct orgs ≥ 30','Count',true,()=>new Set(enriched.map(x=>x.org)).size>=30));
  const tcoTotal=round(TCO.filter(t=>!t.bu.startsWith('- ')&&!t.bu.startsWith(' -')).reduce((a,t)=>a+(t.totalBU||0),0));
  r.push(T('TCO grand total ≈ 469.7','Sum parents',true,()=>approx(tcoTotal,469.7,1.0)));
  return r;
}

// ═══ UI ═══
const SUITES=[
  {id:'data-integrity',name:'1. Data Integrity',fn:suite1,desc:'Raw data counts, totals, duplicates, CCB exceptions'},
  {id:'scoring',name:'2. Scoring Engine',fn:suite2,desc:'RoI bands, qualitative tiers, priority/consequence/band, weighted formula'},
  {id:'stages',name:'3. Stage Assignment',fn:suite3,desc:'CCB exceptions, LFR, carry-over, sustain category rules'},
  {id:'mappings',name:'4. Mapping Validation',fn:suite4,desc:'Dept→Platform, normalisation, ORG_OPS, TCO_PLAT, SUBORG_KEYS'},
  {id:'scenarios',name:'5. Scenario Simulations',fn:suite5,desc:'Budget/tolerance/merit/carry/sustain/value levers, overrides, invariants'},
  {id:'crossval',name:'6. Cross-Validation',fn:suite6,desc:'Engine outputs vs Data Extract meta totals and distributions'}
];

function runAll(){
  document.getElementById('status').textContent='Running tests...';
  allResults={timestamp:new Date().toISOString(),suites:{}};
  let totalPass=0,totalFail=0;
  SUITES.forEach(suite=>{
    const results=suite.fn();
    const pass=results.filter(x=>x.pass).length,fail=results.length-pass;
    totalPass+=pass;totalFail+=fail;
    allResults.suites[suite.id]={name:suite.name,results,pass,fail,total:results.length};
  });
  allResults.totalPass=totalPass;allResults.totalFail=totalFail;allResults.totalTests=totalPass+totalFail;
  renderResults();
}

function renderResults(){
  const{totalPass,totalFail,totalTests}=allResults;
  const badge=document.getElementById('overall-badge');
  badge.style.display='inline-block';
  badge.className='badge '+(totalFail===0?'badge-pass':'badge-fail');
  badge.textContent=totalFail===0?totalPass+'/'+totalTests+' PASSED':totalFail+' FAILED of '+totalTests;
  document.getElementById('status').textContent='Completed: '+totalPass+' passed, '+totalFail+' failed of '+totalTests+' tests.';
  let sg='';
  SUITES.forEach(suite=>{
    const d=allResults.suites[suite.id];const pct=d.total?Math.round(d.pass/d.total*100):0;
    sg+='<div class="suite-card" onclick="scrollToSuite(\''+suite.id+'\')"><h3>'+esc(suite.name)+'</h3><div class="ratio '+(d.fail===0?'all-pass':'has-fail')+'">'+d.pass+'/'+d.total+'</div><div class="bar"><div class="bar-fill" style="width:'+pct+'%;background:'+(d.fail===0?'var(--pass)':'var(--fail)')+'"></div></div><small>'+esc(suite.desc)+'</small></div>';
  });
  document.getElementById('summary-grid').innerHTML=sg;
  let h='';
  SUITES.forEach(suite=>{
    const d=allResults.suites[suite.id];
    h+='<div class="suite" id="suite-'+suite.id+'"><div class="suite-header" onclick="toggleSuite(\''+suite.id+'\')"><h2><span class="arrow" id="arrow-'+suite.id+'">&#9654;</span> '+esc(suite.name)+'</h2><span class="stat '+(d.fail===0?'pass-cell':'fail-cell')+'">'+d.pass+'/'+d.total+' passed</span></div><div class="suite-body" id="body-'+suite.id+'"><table><thead><tr><th>#</th><th>Test</th><th>Input</th><th>Expected</th><th>Actual</th><th>Status</th><th>ms</th></tr></thead><tbody>';
    d.results.forEach((t,i)=>{
      const tag=t.pass?'<span class="tag tag-pass">PASS</span>':'<span class="tag tag-fail">FAIL</span>';
      const ex=typeof t.expected==='object'?JSON.stringify(t.expected):String(t.expected);
      const ac=typeof t.actual==='object'?JSON.stringify(t.actual):String(t.actual);
      h+='<tr><td>'+(i+1)+'</td><td>'+esc(t.name)+'</td><td class="mono">'+esc(String(t.input))+'</td><td class="mono wrap">'+esc(ex.substring(0,80))+'</td><td class="mono wrap">'+esc(ac.substring(0,80))+'</td><td>'+tag+'</td><td class="mono">'+t.ms+'</td></tr>';
    });
    h+='</tbody></table></div></div>';
  });
  document.getElementById('main').innerHTML=h;
  SUITES.forEach(suite=>{if(allResults.suites[suite.id].fail>0)toggleSuite(suite.id);});
}

function toggleSuite(id){document.getElementById('body-'+id).classList.toggle('open');document.getElementById('arrow-'+id).classList.toggle('open');}
function scrollToSuite(id){document.getElementById('suite-'+id).scrollIntoView({behavior:'smooth'});if(!document.getElementById('body-'+id).classList.contains('open'))toggleSuite(id);}
function exportReport(){if(!allResults.timestamp){alert('Run tests first.');return;}const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(allResults,null,2)],{type:'application/json'}));a.download='AOP2027-QA-Report-'+new Date().toISOString().slice(0,10)+'.json';a.click();}

document.getElementById('gen-date').textContent='Generated: '+new Date().toLocaleString();
setTimeout(runAll,100);
</script>
